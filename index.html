.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--fx) 55%,#3fb6f2)}
.bar .t{font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:#fff;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw{display:flex;gap:6px;padding:3px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
.sw button{border:0;background:transparent;color:#fff;font:inherit;font-size:15.5px;font-weight:600;padding:6px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.sw button:hover{background:rgba(255,255,255,.18)}
.sw button[aria-pressed="true"]{background:#fff;color:var(--fx-dk);box-shadow:0 3px 12px rgba(0,0,0,.25)}
.sw button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stage{position:relative;height:calc(100% - var(--bar-h))}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
.stage iframe.on{visibility:visible}
@media (max-width:640px){ :root{--bar-h:54px} .bar{padding:0 10px;gap:8px;background-size:auto 100%,auto;background-position:left center,0 0} .bar .t{display:none} .sw{flex:1} .sw button{flex:1;padding:8px 6px;font-size:13.5px} }
</style>

<body>
<style>
#fxGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(160deg,#043a5a 0%,#03304f 50%,#022640 100%);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
#fxGate .card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:30px 28px 26px;box-shadow:0 18px 50px rgba(0,0,0,.35);color:#0f1f2e}
#fxGate .logo{height:34px;margin:0 auto 18px;display:block}
#fxGate h1{font-size:17px;margin:0 0 4px;text-align:center;letter-spacing:.3px}
#fxGate p{margin:0 0 18px;text-align:center;color:#5b6b7b;font-size:13px}
#fxGate label{display:block;font-size:12px;font-weight:600;color:#44515f;margin-bottom:6px}
#fxGate input[type=password]{width:100%;box-sizing:border-box;height:42px;border:1px solid #c9d2dc;border-radius:9px;padding:0 12px;font:inherit;font-size:15px;outline:none}
#fxGate input[type=password]:focus{border-color:#0a64b4;box-shadow:0 0 0 3px rgba(10,100,180,.15)}
#fxGate .rec{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13px;color:#44515f;font-weight:400}
#fxGate button{width:100%;height:42px;border:0;border-radius:9px;background:#0a64b4;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
#fxGate button:hover{background:#084b88}
#fxGate button:disabled{opacity:.7;cursor:wait}
#fxGate .err{min-height:18px;margin-top:10px;text-align:center;color:#c03535;font-size:13px}
</style>

<label for="fxPass">Clave de acceso</label><input type="password" id="fxPass" autofocus>
<label class="rec"><input type="checkbox" id="fxRec"> Recordar en este equipo</label>
<button type="submit" id="fxBtn">Ingresar</button><div class="err" id="fxErr"></div></form></div>
<script>
const FX_CHK={"v": 1, "it": 250000, "s": "YyhsrBTLyidW6eBkh+EmbQ==", "iv": "A9z0EtbjpAZM/1hX", "d": "0sKvTvUmwXsC5ZnUDXreLbRWsjtVS6eLc6kytYh343WNzTFNpXe34PmKaS/C"};

const FX_K='fxTablerosClave';
function fxB(s){ const r=atob(s), u=new Uint8Array(r.length); for(let i=0;i<r.length;i++) u[i]=r.charCodeAt(i); return u; }
async function fxDescifrar(P, clave){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:fxB(P.s), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const comp=await crypto.subtle.decrypt({name:'AES-GCM', iv:fxB(P.iv)}, key, fxB(P.d));
  const st=new Blob([comp]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
function fxGuardada(){ try{ return sessionStorage.getItem(FX_K) || localStorage.getItem(FX_K); }catch(e){ return null; } }
function fxGuardar(c, rec){ try{ sessionStorage.setItem(FX_K, c); if(rec) localStorage.setItem(FX_K, c); }catch(e){} }
function fxOlvidar(){ try{ sessionStorage.removeItem(FX_K); localStorage.removeItem(FX_K); }catch(e){} }

(async()=>{
  const ok=async c=>{ try{ return (await fxDescifrar(FX_CHK, c))==='fuxion-ok'; }catch(e){ return false; } };
  const abrir=()=>{ document.getElementById('fxGate').remove(); window.fxIniciar && window.fxIniciar(); };
  const g=fxGuardada();
  if(g && await ok(g)){ abrir(); return; } else if(g){ fxOlvidar(); }
  document.getElementById('fxForm').addEventListener('submit', async ev=>{
    ev.preventDefault(); const c=document.getElementById('fxPass').value, b=document.getElementById('fxBtn'), er=document.getElementById('fxErr');
    b.disabled=true; er.textContent='';
    if(await ok(c)){ fxGuardar(c, document.getElementById('fxRec').checked); abrir(); } else { er.textContent='Clave incorrecta'; b.disabled=false; }
  });
})();
</script>

<div class="bar">
  <span class="t">Selecciona almacén</span>
  <div class="sw" role="group" aria-label="Elegir tablero">
    <button type="button" data-k="mp" aria-pressed="false">Almacén Materia Prima</button>
    <button type="button" data-k="pt" aria-pressed="false">Almacén Producto Terminado</button>
  </div>
</div>
<div class="stage">
  <iframe id="f-mp" title="Tablero Materia prima" data-src="mp.html"></iframe>
  <iframe id="f-pt" title="Tablero Producto terminado" data-src="pt.html"></iframe>
</div>
<script>
(function(){
  const VALID = ['mp','pt'];
  const btns = [...document.querySelectorAll('.sw button')];
  function show(k, push){
    if(!VALID.includes(k)) k = 'mp';
    VALID.forEach(x=>{
      const f = document.getElementById('f-'+x), on = x===k;
      if(on && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src + '?v=' + Date.now());   // se carga la primera vez que se elige; ?v= evita que el navegador muestre una versión guardada
      f.classList.toggle('on', on);
    });
    btns.forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===k));
    document.title = (k==='mp' ? 'Almacén Materia Prima' : 'Almacén Producto Terminado') + ' · Consumo y cobertura';
    if(push) history.replaceState(null, '', '#'+k);
    try{ localStorage.setItem('tableroSel', k); }catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click', ()=>show(b.dataset.k, true)));
  window.addEventListener('hashchange', ()=>show(location.hash.slice(1)));
  let ini = location.hash.slice(1);
  if(!VALID.includes(ini)){ try{ ini = localStorage.getItem('tableroSel') || 'mp'; }catch(e){ ini = 'mp'; } }
  window.fxIniciar = () => show(ini, false);     // se abre después de ingresar la clave
})();
</script>
