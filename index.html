<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo y Cobertura · Almacenes</title>
<style>
:root{ --bar:#0f2740; --bar2:#173554; --ink:#dbe6f1; --mut:#8ea6be; --accent:#0f8b8d; --bg:#eef1f4; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bar:#0b1a2b; --bar2:#13283f; --bg:#0e1318; --accent:#2bb3b5; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.bar{height:48px;background:var(--bar);color:var(--ink);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 16px;border-bottom:1px solid #00000033}
.bar .t{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700;white-space:nowrap}
.sw{display:flex;background:var(--bar2);border:1px solid #2c4a69;border-radius:9px;padding:3px;gap:3px}
.sw button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.sw button:hover{background:#1f4166}
.sw button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.stage{position:relative;height:calc(100% - 48px)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
.stage iframe.on{visibility:visible}
@media (max-width:640px){ .bar{padding:0 10px;gap:8px} .bar .t{display:none} .sw{flex:1} .sw button{flex:1;padding:6px 6px;font-size:12.5px} }
</style>
</head>
<body>
<div class="bar">
  <span class="t">Selecciona almacén</span>
  <div class="sw" role="group" aria-label="Elegir tablero">
    <button type="button" data-k="mp" aria-pressed="false">Almacén Materia Prima</button>
    <button type="button" data-k="pt" aria-pressed="false">Almacén Producto Terminado</button>
  </div>
</div>
<div class="stage">
  <iframe id="f-mp" title="Tablero Materia prima" data-src="mp.html"></iframe>
  <iframe id="f-pt" title="Tablero Producto terminado" data-src="pt.html"></iframe>
</div>
<script>
(function(){
  const VALID = ['mp','pt'];
  const btns = [...document.querySelectorAll('.sw button')];
  function show(k, push){
    if(!VALID.includes(k)) k = 'mp';
    VALID.forEach(x=>{
      const f = document.getElementById('f-'+x), on = x===k;
      if(on && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src);   // cada tablero se carga la primera vez que se elige
      f.classList.toggle('on', on);
    });
    btns.forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===k));
    document.title = (k==='mp' ? 'Almacén Materia Prima' : 'Almacén Producto Terminado') + ' · Consumo y cobertura';
    if(push) history.replaceState(null, '', '#'+k);
    try{ localStorage.setItem('tableroSel', k); }catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click', ()=>show(b.dataset.k, true)));
  window.addEventListener('hashchange', ()=>show(location.hash.slice(1)));
  let ini = location.hash.slice(1);
  if(!VALID.includes(ini)){ try{ ini = localStorage.getItem('tableroSel') || 'mp'; }catch(e){ ini = 'mp'; } }
  show(ini, false);
})();
</script>
</body>
</html>
